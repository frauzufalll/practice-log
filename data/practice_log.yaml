    Feeling like a baby deer, but sometimes I forget I'm on the wrong number of wheels, and then it works better. Focused on my posture today. Things I noticed:
    - my feet muscles have to work much more
    - I feel quite unstable in general, not to my surprise, but in general similar to the few times I went ice skating in the winter
    - simple strokes are more difficult for me than other moves where both feet stay on the ground
    - I need less power to roll around, which is why I bought them. On some paths here where I could skate nicely, there's too much friction with the quads.
    - using the quads afterwards is weird for a moment too 😂
    Also, some toestop steps in here @thatnicolefiore taught us 😎
    #Inline Skating #inlineskating
  elements:
    [Inline Skating]

