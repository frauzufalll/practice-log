- date: 2024-09-03
  url: "https://www.instagram.com/p/C_cu3Y9uiQC/"
  displayUrl: "https://scontent-lga3-1.cdninstagram.com/v/t51.29350-15/458141417_435809152803807_8285759061697161974_n.jpg?stp=dst-jpg_e15_tt6&_nc_ht=scontent-lga3-1.cdninstagram.com&_nc_cat=103&_nc_oc=Q6cZ2QGW_lbsFVzKM-8ZI3t-KDdxdWXGZryY1-uRsV4PYy1jxn-LKZxf9M0jmsLEAkw-nCykzgalwuBfObz5sLHaT-y7&_nc_ohc=xoNYfK-E7bIQ7kNvwGq0Dqy&_nc_gid=lOWtQVT0psm5a6V-yFI1gw&edm=APs17CUBAAAA&ccb=7-5&oh=00_AfFx2hACsr3oDLaAWUr8WDHMQWb7VVwoObG-Yc6xNl7OmQ&oe=68144E12&_nc_sid=10d13b"
  description: |
    From my drafts: Twizzle / marching turns drill - this is a little sequence which helped me to improve my free leg position when traveling. It's 3 three turns alternating between left and right side. That's means one side starts forward, the other one backwards. In the video it's LBO, LFI, LBO, leg switch, RFI, RBO, RFI. Then I did the same but started with the other leg (RBO, RFI, RFO, leg switch, LFI, LBO, LFI). Same with the other edges: LBI, LFO, LBI, leg switch, RFO, RBI, RFO (starting with the other leg: RBI, RFO, RBI, leg switch, LFO, LBI, LFO)
    Why I liked it:
    - I can train all 3turns with 2 sequences which can be repeated in a loop
    - depending how I start, a turn I struggle with can either be in the middle of the 3turns or at the beginning and end - I like training elements in different settings
    - in order to get a smooth rotation across the 3 turns, the leg can't swing as much as I would usually swing it in 3 turns. It helped me understand how the free leg and the upper body have to be in sync to be at the correct position for the next turn.
    
    I hope what I wrote made sense to someone. This is an older video, I currently can't skate, and I'm not sure when I will be able to skate again. I wish I could transfer my skatelove ticket to someone who could actually use it.. hugs to you all. I miss skating with you here so much.
    
    #rollerskating #quadsociety
  sequence: three-turn-marching-turn-drill

